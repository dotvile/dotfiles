# Paquetes CLI del sistema (apt/pacman). Linux-first para el perfil ubuntu-server.
#
# Fuera de este archivo, gestionados por el instalador:
#   - zsh, toolchain de build, yq, asdf  -> _setup/lib/bootstrap.sh (bootstrap_prereqs)
#   - starship, neovim (>=0.10)          -> _setup/lib/bootstrap.sh (install_extras)
#   - node, python, go, ...              -> _setup/bin/install_runtimes.sh (asdf)
#   - docker (Docker CE)                 -> fase de servicios del homelab (no aquí)
apps:
  # CLI esencial
  - fzf
  - ripgrep
  - fastfetch
  - jq
  - tree
  - htop
