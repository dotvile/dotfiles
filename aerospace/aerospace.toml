start-at-login = true

after-login-command = []
after-startup-command = []
exec-on-workspace-change = []

on-focused-monitor-changed = [
  'move-mouse monitor-lazy-center'
]

on-focus-changed = [
  'move-mouse window-lazy-center',
]

enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false
accordion-padding = 20
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
 
[gaps]
inner.horizontal = 5
inner.vertical =   5
outer.left =       0
outer.bottom =     0
outer.top =        0#[{monitor.'^built-in retina display$' = 20 }, 52]
outer.right =      0

[mode.main.binding]
ctrl-period = 'layout tiles horizontal vertical'
ctrl-comma = 'layout accordion horizontal vertical'

cmd-left = 'focus left'
cmd-down = 'focus down'
cmd-up = 'focus up'
cmd-right = 'focus right'

cmd-shift-left = 'move left'
cmd-shift-down = 'move down'
cmd-shift-up = 'move up'
cmd-shift-right = 'move right'

cmd-shift-minus = 'resize smart -50'
cmd-shift-equal = 'resize smart +50'
cmd-shift-space = 'fullscreen' 

cmd-alt-left = ['join-with left', 'mode main']
cmd-alt-down = ['join-with down', 'mode main']
cmd-alt-up = ['join-with up', 'mode main']
cmd-alt-right = ['join-with right', 'mode main']
cmd-alt-f = ['layout floating tiling', 'mode main'] 

cmd-ctrl-right = 'workspace --wrap-around next'
cmd-ctrl-left = 'workspace --wrap-around prev'
cmd-ctrl-up = 'focus-monitor --wrap-around next'
cmd-ctrl-down = 'focus-monitor --wrap-around prev'

f1 = 'workspace 1'
f2 = 'workspace 2'
f3 = 'workspace 3'
f4 = 'workspace 4'
f5 = 'workspace 5'
f6 = 'workspace 6'
f7 = 'workspace 7'
f8 = 'workspace 8'
f9 = 'workspace 9'

shift-f1 = 'move-node-to-workspace 1'
shift-f2 = 'move-node-to-workspace 2'
shift-f3 = 'move-node-to-workspace 3'
shift-f4 = 'move-node-to-workspace 4'
shift-f5 = 'move-node-to-workspace 5'
shift-f6 = 'move-node-to-workspace 6'
shift-f7 = 'move-node-to-workspace 7'
shift-f8 = 'move-node-to-workspace 8'
shift-f9 = 'move-node-to-workspace 9'

#Focus monitor shortcuts
cmd-alt-m = 'focus-monitor main'
cmd-alt-s = 'focus-monitor secondary'
cmd-alt-b = 'focus-monitor built-in'

ctrl-esc = 'mode service'

[workspace-to-monitor-force-assignment]

# Monitor principal — LG UltraGear (DP → dock Caldigit): espacios 1-5 (F1-F5)
1 = ['LG ULTRAGEAR', 'built-in']
2 = ['LG ULTRAGEAR', 'built-in']
4 = ['LG ULTRAGEAR', 'built-in']
5 = ['LG ULTRAGEAR', 'built-in']
7 = ['LG ULTRAGEAR', 'built-in']

# Monitor auxiliar — LG DualUp / SDQHD (USB-C → dock Caldigit): espacios 6-9 (F6-F9)
3 = ['LG SDQHD', 'built-in']
6 = ['LG SDQHD', 'built-in']
8 = ['LG SDQHD', 'built-in']
9 = ['LG SDQHD', 'built-in']

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
backspace = ['close-all-windows-but-current', 'mode main']
