# ~/.config/tmux/tmux.conf — perfil raspi4
#
# Gemelo del perfil macOS (rama main) con tres diferencias obligadas:
#   1. Portapapeles vía OSC 52 (no hay pbcopy, ni X, ni Wayland en headless).
#   2. Guards de versión: Raspberry Pi OS (bookworm) sirve tmux 3.3a.
#   3. Acento berry = paleta `raspi_berry` de starship. El color dice la maquina.
#
# Aquí no hay emulador: el terminal lo pone la máquina desde la que te conectas.
#
# Prefijo: Ctrl-a  (^a).  Navegación Colemak: h=izq t=abajo n=arriba s=der


# ── 1. Color ────────────────────────────────────────────────────────────
# tmux-256color vive en el paquete `ncurses-term`. Si falta, tmux arranca
# con error; por eso el fallback a screen-256color.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

%if "#{>=:#{version},3.2}"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",wezterm:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",*:usstyle"
%else
set -ga terminal-overrides ",xterm-256color:Tc"
%endif


# ── 2. Comportamiento base ──────────────────────────────────────────────
set  -g  mouse on
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on
set  -sg escape-time 10
set  -g  focus-events on
set  -g  history-limit 20000       # menos que en x86: la Pi va justa de RAM
set  -g  detach-on-destroy off

# El portapapeles del servidor no existe: OSC 52 manda la copia por el
# socket SSH al portapapeles de TU Mac. WezTerm lo soporta de serie.
set  -g  set-clipboard on

%if "#{>=:#{version},3.3}"
set  -g  allow-passthrough on
%endif


# ── 3. Prefijo ──────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix


# ── 4. Panes ────────────────────────────────────────────────────────────
bind v split-window -h -c "#{pane_current_path}"
bind z split-window -v -c "#{pane_current_path}"
bind w kill-pane

bind h select-pane -L
bind t select-pane -D
bind n select-pane -U
bind s select-pane -R

bind -r H resize-pane -L 5
bind -r T resize-pane -D 5
bind -r N resize-pane -U 5
bind -r S resize-pane -R 5

bind f resize-pane -Z
bind Space next-layout


# ── 4b. Sin prefijo: Ctrl+Alt para lo que usas cada minuto ──────────────
# Misma combinacion que tenias en wezterm.lua, asi que la memoria muscular
# no cambia. Ctrl+Alt no compone caracteres, asi que la ñ y los acentos
# (Option+n, Option+e) siguen funcionando dentro de tmux.
bind -n C-M-h select-pane -L
bind -n C-M-t select-pane -D
bind -n C-M-n select-pane -U
bind -n C-M-s select-pane -R
bind -n C-M-v split-window -h -c "#{pane_current_path}"
bind -n C-M-z split-window -v -c "#{pane_current_path}"
bind -n C-M-w confirm-before -p "cerrar este pane? (y/n)" kill-pane
bind -n C-M-f resize-pane -Z

# Windows sin prefijo. OJO: Ctrl+Alt+NUMERO no llega a tmux (ni Tab ni
# Enter), asi que ir a una window concreta sigue siendo ^a 1..9.
bind -n C-M-c     new-window -c "#{pane_current_path}"
bind -n C-M-Left  previous-window
bind -n C-M-Right next-window
bind -n C-M-Space next-layout

# Salir dejandolo todo vivo. No es destructivo: se recupera con `tmux a`.
bind -n C-M-d detach-client

# ── 4c. Anidado: F12 cede TODAS las teclas al tmux de dentro ────────────
# Con dos tmux del mismo prefijo, el de fuera se come todo. F12 lo apaga
# entero (prefijo y bindings sin prefijo) para que pasen al de dentro.
# La barra se pone en rojo mientras esta cedido, para que no te pierdas.
bind -T root F12 \
  set prefix None \; \
  set key-table off \; \
  set -g status-style "bg=default,fg=#ff8787" \; \
  set -g status-left "#[fg=#ff8787,bold] TECLAS CEDIDAS AL DE DENTRO — F12 vuelve #[default]" \; \
  refresh-client -S

# OJO: "set -gu" NO restaura, DESACTIVA (deja el valor por defecto de
# tmux). Hay que reponer los valores buenos a mano.
bind -T off F12 \
  set -u prefix \; \
  set -u key-table \; \
  set -g status-style "bg=default,fg=#6c7883" \; \
  set -g status-left  "#[fg=#e64980,bold] sesion:#S #[fg=#5c2a4d]│#[fg=#6c7883] ventanas:#[default]" \; \
  refresh-client -S


# ── 5. Windows y sesiones ───────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -r Tab      next-window
bind -r BTab     previous-window
bind j choose-tree -Zs
bind X confirm-before -p "matar la window #W? (y/n)" kill-window
bind , command-prompt -I "#W" "rename-window '%%'"
bind $ command-prompt -I "#S" "rename-session '%%'"


# ── 6. Modo copia (vi) ──────────────────────────────────────────────────
# Sin pbcopy: copy-selection usa set-clipboard -> OSC 52 -> tu Mac.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel


# ── 7. Aspecto ──────────────────────────────────────────────────────────
# bg=default para no romper la opacidad del emulador local.
# Acento BERRY (#e64980) = raspi_berry. macOS es verde salvia, servidor es teal.
set -g window-style        "fg=#6c7883,bg=default"
set -g window-active-style "fg=#fff0f6,bg=default"

set -g pane-border-style        "fg=#2b1421"
set -g pane-active-border-style "fg=#e64980"

# Barra: las TRES capas etiquetadas a la vez
#   izquierda -> que SESION            centro -> que WINDOWS hay (la activa con ◂)
#   derecha   -> en que PANE estas, y en QUE MAQUINA
set -g status-style "bg=default,fg=#6c7883"
set -g status-left  "#[fg=#e64980,bold] sesion:#S #[fg=#5c2a4d]│#[fg=#6c7883] ventanas:#[default]"
set -g status-right "#[fg=#5c2a4d]│#[fg=#6c7883] pane #{pane_index}/#{window_panes} #[fg=#5c2a4d]│#[fg=#e64980,bold] #h "
set -g status-left-length 40
set -g status-right-length 40

setw -g window-status-format         "#[fg=#5c6b7a] #I:#W #[default]"
setw -g window-status-current-format "#[fg=#fff0f6,bold] #I:#W ◂#[default]"
set  -g message-style "fg=#fff0f6,bg=default"

# Etiqueta encima de CADA pane. Si el pane no tiene titulo propio (por defecto
# es el hostname, que no sirve), muestra el comando que esta corriendo.
set -g pane-border-status top
set -g pane-border-format " pane #{pane_index}: #{?#{m:#{host_short}*,#{pane_title}},#{pane_current_command},#{pane_title}}#{?pane_active, ●,} "


# ── 7b. Ayudas para aprender la jerarquia ──────────────────────────────
bind i display-message "sesion: #S  │  window: #I:#W  │  pane: #P de #{window_panes} (#{pane_current_command})"
bind b if-shell -F "#{@borders_off}" \
  "set -g pane-border-status top ; set -g @borders_off 0" \
  "set -g pane-border-status off ; set -g @borders_off 1"
bind T command-prompt -I "#{pane_title}" "select-pane -T '%%'"


# ── 8. Recargar config ──────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recargado"
