# ~/.config/tmux/tmux.conf
#
# Todo el COMPORTAMIENTO del terminal vive aquí (portable a cualquier máquina).
# El emulador (wezterm.lua) solo se ocupa del ASPECTO: fuente, colores, opacidad.
#
# Prefijo: Ctrl-a  (en los comentarios: ^a)
# Navegación Colemak: h=izq  t=abajo  n=arriba  s=der


# ── 1. Color ────────────────────────────────────────────────────────────
# Sin esto tmux degrada tus colores hex de starship a la paleta de 256.
set  -g  default-terminal "tmux-256color"
set  -as terminal-features ",xterm-256color:RGB"
set  -as terminal-features ",wezterm:RGB"
set  -as terminal-features ",xterm-ghostty:RGB"
set  -as terminal-features ",*:usstyle"          # undercurl de nvim (LSP)


# ── 2. Comportamiento base ──────────────────────────────────────────────
set  -g  mouse on                  # scroll, resize y selección de pane con ratón
set  -g  base-index 1              # windows desde 1 (como tus F1-F9 de AeroSpace)
setw -g  pane-base-index 1
set  -g  renumber-windows on       # sin huecos al cerrar una window
set  -sg escape-time 10            # Esc instantáneo en nvim
set  -g  focus-events on           # nvim detecta foco (autoread, autosave)
set  -g  history-limit 50000       # el output de un agente es largo
set  -g  allow-passthrough on      # imágenes / secuencias crudas (nvim, claude)
set  -g  detach-on-destroy off     # al cerrar una sesión, salta a otra en vez de salir
set  -g  set-clipboard on


# ── 3. Prefijo ──────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix               # ^a ^a manda un Ctrl-a literal (inicio de línea)


# ── 4. Panes  (misma memoria muscular que tu WezTerm) ───────────────────
bind v split-window -h -c "#{pane_current_path}"   # split vertical (pane a la derecha)
bind z split-window -v -c "#{pane_current_path}"   # split horizontal (pane abajo)
bind w kill-pane

# Navegar: ^a h/t/n/s
bind h select-pane -L
bind t select-pane -D
bind n select-pane -U
bind s select-pane -R

# Redimensionar: ^a H/T/N/S  (mantén ^a pulsado y repite)
bind -r H resize-pane -L 5
bind -r T resize-pane -D 5
bind -r N resize-pane -U 5
bind -r S resize-pane -R 5

bind f resize-pane -Z              # zoom: un pane a pantalla completa y volver
bind Space next-layout


# ── 5. Windows y sesiones ───────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -r Tab      next-window
bind -r BTab     previous-window
bind j choose-tree -Zs             # navegador visual de sesiones y windows
bind X confirm-before -p "matar la window #W? (y/n)" kill-window
bind , command-prompt -I "#W" "rename-window '%%'"
bind $ command-prompt -I "#S" "rename-session '%%'"


# ── 6. Modo copia (vi) ──────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel


# ── 7. Aspecto (mínimo, y bg=default para NO romper tu opacidad 0.75) ───
# Paleta tomada de tu starship.toml para que todo case.
set -g window-style        "fg=#6c7883,bg=default"   # pane inactivo, atenuado
set -g window-active-style "fg=#f1f3f5,bg=default"   # pane activo

set -g pane-border-style        "fg=#1c2126"
set -g pane-active-border-style "fg=#5faa8a"

# Barra: las TRES capas etiquetadas a la vez
#   izquierda -> que SESION            centro -> que WINDOWS hay (la activa con ◂)
#   derecha   -> en que PANE estas
set -g status-style "bg=default,fg=#6c7883"
set -g status-left  "#[fg=#5faa8a,bold] sesion:#S #[fg=#343a40]│#[fg=#6c7883] ventanas:#[default]"
set -g status-right "#[fg=#343a40]│#[fg=#6c7883] pane #{pane_index}/#{window_panes} #[fg=#343a40]│#[fg=#5faa8a] %H:%M "
set -g status-left-length 40
set -g status-right-length 40

setw -g window-status-format         "#[fg=#5c6b7a] #I:#W #[default]"
setw -g window-status-current-format "#[fg=#f1f3f5,bold] #I:#W ◂#[default]"
set  -g message-style "fg=#f1f3f5,bg=default"

# Etiqueta encima de CADA pane. Si el pane no tiene titulo propio (por defecto
# es el hostname, que no sirve), muestra el comando que esta corriendo.
set -g pane-border-status top
set -g pane-border-format " pane #{pane_index}: #{?#{m:#{host_short}*,#{pane_title}},#{pane_current_command},#{pane_title}}#{?pane_active, ●,} "


# ── 7b. Ayudas para aprender la jerarquia ──────────────────────────────
# ^a i  -> te dice exactamente donde estas
bind i display-message "sesion: #S  │  window: #I:#W  │  pane: #P de #{window_panes} (#{pane_current_command})"
# ^a b  -> quita/pone las etiquetas de pane cuando ya no las necesites
bind b if-shell -F "#{@borders_off}" \
  "set -g pane-border-status top ; set -g @borders_off 0" \
  "set -g pane-border-status off ; set -g @borders_off 1"
# ^a T  -> ponerle nombre propio a un pane
bind T command-prompt -I "#{pane_title}" "select-pane -T '%%'"


# ── 8. Recargar config ──────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recargado"
