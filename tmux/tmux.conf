set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 100000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g escape-time 10
set -g focus-events on

setw -g mode-keys vi
setw -g automatic-rename on
setw -g aggressive-resize on

set -g status-position top
set -g status-style "bg=#02051F,fg=#c0caf5"
set -g message-style "bg=#1f2335,fg=#c0caf5"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left " #[fg=#7aa2f7,bold]#S "
set -g status-right "#[fg=#9ece6a]%Y-%m-%d #[fg=#7dcfff]%H:%M "
set -g window-status-current-format "#[fg=#02051F,bg=#7aa2f7,bold] #I:#W "
set -g window-status-format "#[fg=#c0caf5] #I:#W "

# Fast reload.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# Splits that keep the current working directory.
bind v split-window -h -c '#{pane_current_path}'
bind z split-window -v -c '#{pane_current_path}'

# Match your directional muscle memory.
bind h select-pane -L
bind t select-pane -D
bind n select-pane -U
bind s select-pane -R

bind -r H resize-pane -L 5
bind -r T resize-pane -D 5
bind -r N resize-pane -U 5
bind -r S resize-pane -R 5

bind w kill-pane
bind q kill-window
bind m choose-tree -Zw
bind e new-window -c '#{pane_current_path}'
bind Enter last-window
bind Space next-layout
bind f resize-pane -Z

# Vim-style copy mode.
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Session helpers.
bind C-f command-prompt -p "find session" "switch-client -t '%%'"
bind C-n new-session -A -s main

bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

bind-key -n M-Left previous-window
bind-key -n M-Right next-window
