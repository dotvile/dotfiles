# Keep the EndeavourOS look-and-feel pieces, but avoid hard failures.

exec_always --no-startup-id sh -c '[ -x "$HOME/.config/i3/scripts/import-gsettings" ] && "$HOME/.config/i3/scripts/import-gsettings"'
exec_always --no-startup-id sh -c 'xinput list --id-only | while read -r id; do xinput list-props "$id" 2>/dev/null | rg -q "libinput Natural Scrolling Enabled" && xinput set-prop "$id" "libinput Natural Scrolling Enabled" 1 >/dev/null 2>&1; done'
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec --no-startup-id xss-lock -l ~/.config/i3/scripts/blur-lock
exec --no-startup-id dex --autostart --environment i3
exec --no-startup-id sh -c '[ -x "$HOME/.screenlayout/monitor.sh" ] && "$HOME/.screenlayout/monitor.sh"'
exec --no-startup-id sh -c '[ -f /usr/share/endeavouros/backgrounds/endeavouros-wallpaper.png ] && feh --bg-fill /usr/share/endeavouros/backgrounds/endeavouros-wallpaper.png'
exec --no-startup-id xset s 480 dpms 600 600 600
exec --no-startup-id /usr/bin/dunst
