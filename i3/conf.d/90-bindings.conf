# Aerospace-like bindings for i3.
# The goal is: preserve Endeavour appearance, replace interaction model.

# Launchers and session control.
bindsym $mod+Return exec --no-startup-id $term
bindsym $mod+d exec --no-startup-id /usr/bin/godot-mono
bindsym $mod+space exec --no-startup-id $menu
bindsym $mod+t exec --no-startup-id $window_menu
bindsym $mod+b exec --no-startup-id /usr/bin/firefox
bindsym $mod+g exec --no-startup-id /usr/bin/firefox --class github-pwa --new-window https://github.com
bindsym $mod+f exec --no-startup-id $file_manager
bindsym $mod+y exec --no-startup-id /usr/bin/firefox --class youtube --new-window https://www.youtube.com
bindsym $mod+Shift+y exec --no-startup-id /usr/bin/firefox --class youtube-music --new-window https://music.youtube.com

bindsym $mod+q kill
bindsym $mod+Shift+e exec --no-startup-id ~/.config/i3/scripts/powermenu
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart
bindsym $mod+l exec --no-startup-id ~/.config/i3/scripts/blur-lock

# Focus and movement: arrow-driven, like your Aerospace setup.
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# Layout and container state.
bindsym Control+period split h
bindsym Control+comma layout stacking
bindsym $mod+Shift+space fullscreen toggle
bindsym $mod+$alt+f floating toggle
bindsym $mod+Shift+f focus mode_toggle
bindsym $mod+a focus parent
bindsym $mod+Shift+minus resize shrink width 50 px or 50 ppt
bindsym $mod+Shift+equal resize grow width 50 px or 50 ppt

# i3 has no direct join-with command, so split and move is the closest equivalent.
bindsym $mod+$alt+Left split h, move left
bindsym $mod+$alt+Down split v, move down
bindsym $mod+$alt+Up split v, move up
bindsym $mod+$alt+Right split h, move right

# Workspace and monitor navigation.
bindsym $mod+Control+Right workspace next
bindsym $mod+Control+Left workspace prev
bindsym $mod+Control+Up focus output right
bindsym $mod+Control+Down focus output left
bindsym $mod+$alt+m focus output $monitor_main

bindsym F1 workspace $ws1
bindsym F2 workspace $ws2
bindsym F3 workspace $ws3
bindsym F4 workspace $ws4
bindsym F5 workspace $ws5
bindsym F6 workspace $ws6
bindsym F7 workspace $ws7
bindsym F8 workspace $ws8
bindsym F9 workspace $ws9

bindsym Shift+F1 move container to workspace $ws1
bindsym Shift+F2 move container to workspace $ws2
bindsym Shift+F3 move container to workspace $ws3
bindsym Shift+F4 move container to workspace $ws4
bindsym Shift+F5 move container to workspace $ws5
bindsym Shift+F6 move container to workspace $ws6
bindsym Shift+F7 move container to workspace $ws7
bindsym Shift+F8 move container to workspace $ws8
bindsym Shift+F9 move container to workspace $ws9

# Service mode.
bindsym Control+Escape mode "service"

mode "service" {
    bindsym Escape mode "default"
    bindsym c reload, mode "default"
    bindsym r restart, mode "default"
    bindsym BackSpace kill, mode "default"
}

# Multimedia and system helpers kept from EndeavourOS.
bindsym XF86MonBrightnessUp exec --no-startup-id ~/.config/i3/scripts/volume_brightness.sh brightness_up
bindsym XF86MonBrightnessDown exec --no-startup-id ~/.config/i3/scripts/volume_brightness.sh brightness_down
bindsym XF86AudioRaiseVolume exec --no-startup-id ~/.config/i3/scripts/volume_brightness.sh volume_up
bindsym XF86AudioLowerVolume exec --no-startup-id ~/.config/i3/scripts/volume_brightness.sh volume_down
bindsym XF86AudioMute exec --no-startup-id ~/.config/i3/scripts/volume_brightness.sh volume_mute
bindsym XF86AudioMicMute exec amixer sset Capture toggle
bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause
bindsym XF86AudioNext exec --no-startup-id playerctl next
bindsym XF86AudioPrev exec --no-startup-id playerctl previous
bindsym $mod+p exec --no-startup-id ~/.config/i3/scripts/audio-device-switch

bindsym Print exec --no-startup-id scrot ~/%Y-%m-%d-%T-screenshot.png && notify-send "Screenshot saved to ~/$(date +"%Y-%m-%d-%T")-screenshot.png"
bindsym $mod+Print exec --no-startup-id scrot -u ~/%Y-%m-%d-%T-screenshot.png && notify-send "Screenshot saved to ~/$(date +"%Y-%m-%d-%T")-screenshot.png"
bindsym $mod+Shift+Print exec --no-startup-id scrot -s ~/%Y-%m-%d-%T-screenshot.png && notify-send "Screenshot saved to ~/$(date +"%Y-%m-%d-%T")-screenshot.png"
